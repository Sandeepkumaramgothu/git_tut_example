<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
        }
        nav a {
            color: #fff;
            padding: 1rem;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #555;
        }
        .hero {
            background-image: url('restaurant.jpg');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
        }
        .hero h1 {
            font-size: 3rem;
        }
        .content {
            padding: 2rem;
        }
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .menu-item {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 1rem;
            padding: 1rem;
            width: 300px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .menu-item img {
            max-width: 100%;
            border-radius: 5px;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Restaurant Name</h1>
    </header>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#contact">Contact</a>
    </nav>
    <div class="hero">
        <h1>Welcome to Our Restaurant</h1>
    </div>
    <div class="content">
        <h2 id="menu">Our Menu</h2>
        <div class="menu">
            <div class="menu-item">
                <img src="dish1.jpg" alt="Dish 1">
                <h3>Dish 1</h3>
                <p>Description of Dish 1.</p>
            </div>
            <div class="menu-item">
                <img src="dish2.jpg" alt="Dish 2">
                <h3>Dish 2</h3>
                <p>Description of Dish 2.</p>
            </div>
            <div class="menu-item">
                <img src="dish3.jpg" alt="Dish 3">
                <h3>Dish 3</h3>
                <p>Description of Dish 3.</p>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 Restaurant Name. All rights reserved.</p>
    </footer>
</body>
</html>
